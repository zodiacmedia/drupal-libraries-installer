name: drupal-libraries-installer

services:
  app:
    type: php:7.2
    via: cli
    composer_version: 2
    xdebug: false
    overrides:
      environment:
        PHP_IDE_CONFIG: "serverName=appserver"
        XDEBUG_CONFIG: ""
        XDEBUG_MODE: debug
        COMPOSER_ALLOW_XDEBUG: 1
    config:
      php: .php.ini

tooling:
  composer: { service: app, cmd: /app/vendor/bin/composer, description: Run local Composer }
  composer1: { service: app, cmd: /usr/local/bin/composer, description: Run Composer }

  xdebug-on:
    description: Enable xdebug.
    cmd:
      - app: docker-php-ext-enable xdebug 2>/dev/null && /etc/init.d/apache2 reload && echo "Enabled xdebug"
    user: root
  xdebug-off:
    description: Disable xdebug.
    cmd:
      - app: rm -rf /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload && echo "Disabled xdebug"
    user: root
